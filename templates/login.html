<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In – WebTrust</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav class="navbar">
    <div class="container nav-container">
      <a class="brand-logo" href="{{ url_for('home') }}">🛡️ WebTrust <span class="brand-badge">AI SECURITY CONSOLE</span></a>
      <a class="nav-link" href="{{ url_for('home') }}">Back to home</a>
    </div>
  </nav>
  <main class="container" style="max-width: 520px; padding-top: 80px;">
    <section class="details-card">
      <div class="hero-pill">Your private scan workspace</div>
      <h1 class="hero-title" style="font-size: 3rem;">Sign in to WebTrust</h1>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <p class="signal-item warning">{{ message }}</p>
        {% endfor %}
      {% endwith %}
      <form method="post">
        <p><label>Email<br><input name="email" type="email" required></label></p>
        <p><label>Password<br><input name="password" type="password" required></label></p>
        <button class="btn-primary" type="submit">Sign In</button>
      </form>
      <p><a href="{{ url_for('register') }}">Create an account</a></p>
    </section>
  </main>
</body>
</html>
